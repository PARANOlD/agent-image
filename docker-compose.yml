networks:
  agentnet:
    driver: bridge

volumes:
  ollama_data:
  openhands_state:

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    networks:
      - agentnet
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-24576}
      # Pin to a single request slot. Ollama sizes the KV cache as
      # context_length * num_parallel, and picks num_parallel dynamically --
      # at 2 slots a 14B model at 24576 context needs ~20GB, overflows a 16GB
      # card, and silently falls back to 100% CPU (multi-minute responses, no
      # error). One slot keeps it ~13GB and safely on the GPU. Gary handles
      # one conversation at a time anyway.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs openhands-agent-server standalone (REST API on :8000) rather than the
  # "classic" UI app -- we drive it entirely from chat-bridge, so we don't
  # need the classic app's own Socket.IO web UI or its docker-socket-mounted
  # per-task sandbox containers. LLM config (model/base_url/api_key) is sent
  # per-conversation in the API request body by chat-bridge, not set here.
  openhands:
    image: ${OPENHANDS_IMAGE:-ghcr.io/openhands/agent-server:1.26.0-python}
    command: ["--host", "0.0.0.0", "--port", "8000", "--import-modules", "openhands.tools"]
    restart: unless-stopped
    networks:
      - agentnet
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OH_SESSION_API_KEYS_0=${OPENHANDS_API_KEY:-}
      - OH_SECRET_KEY=${OPENHANDS_SECRET_KEY:-}
      - LOG_ALL_EVENTS=true
      # /workspace is bind-mounted from the host (owned by your host user) but
      # the container runs as uid 10001 -- git refuses to operate in a
      # directory it doesn't own ("dubious ownership") unless told it's safe.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/workspace
    volumes:
      - openhands_state:/.openhands
      - ./workspace:/workspace
    healthcheck:
      # A 401 (no auth header) still proves the server is up and listening.
      test: ["CMD", "python", "-c", "import urllib.request as u, urllib.error as e\ntry:\n u.urlopen('http://localhost:8000/api/conversations', timeout=3)\nexcept e.HTTPError:\n pass"]
      interval: 10s
      timeout: 5s
      retries: 12

  chat-bridge:
    build: ./services/chat-bridge
    image: gary-chat-bridge:local
    restart: unless-stopped
    networks:
      - agentnet
    depends_on:
      openhands:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - OPENHANDS_API_BASE=http://openhands:8000
      - GITHUB_APP_PRIVATE_KEY_PATH=/app/secrets/${GITHUB_APP_PRIVATE_KEY_FILENAME:-gary-app.pem}
    volumes:
      - ./state:/app/state
      - ./secrets:/app/secrets:ro
